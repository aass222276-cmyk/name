<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Manga Name Editor v3</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>

    <div id="toolbar">
        <button id="btnSerif" class="tool-toggle" title="セリフ (S)">セリフ</button>
        <button id="btnKoma" class="tool-toggle" title="コマ枠 (K)">コマ</button>
        
        <div class="separator"></div>

        <label for="sliderFontSize" title="文字サイズ">F:</label>
        <input type="range" id="sliderFontSize" min="10" max="48" value="16">
        <span id="fontSizeValue">16px</span>

        <div class="separator"></div>

        <button id="btnPageAddBefore" title="前にページ追加 (↑)">p↑</button>
        <button id="btnPageAddAfter" title="後にページ追加 (↓)">p↓</button>
        <button id="btnPageDelete" title="ページ削除 (X)">p×</button>

        <div class="separator"></div>

        <button id="btnCopyText" title="テキストコピー">Copy</button>
        <button id="btnPasteText" title="テキストペースト">Paste</button>
        
        <div class="separator"></div>
        
        <button id="btnPNG" title="PNG書き出し">PNG</button>
        <button id="btnZIP" title="ZIP書き出し">ZIP</button>
    </div>

    <div id="canvasContainer">
        <canvas id="mainCanvas"></canvas>
        <textarea id="bubbleEditor"></textarea>
    </div>

    <div id="selectionPanelBubble">
        <button id="shapeEllipse">楕円</button>
        <button id="shapeRect">四角</button>
        <button id="shapeSaw">ギザ</button>
        <button id="deleteBubble">削除</button>
    </div>
    
    <div id="selectionPanelGutter">
        <button id="deleteGutter">コマ枠 削除</button>
    </div>


    <div id="pagestrip">
        </div>

    <textarea id="textIO" aria-hidden="true"></textarea>

</body>
</html>
