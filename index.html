<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Manga Name Editor v8</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>

    <div id="toolbar">
        
        <button id="btnPageAddBefore" title="前にページ追加 (↑)">p<br>↑</button>
        <button id="btnPageAddAfter" title="後にページ追加 (↓)">p<br>↓</button>
        <button id="btnPageDelete" title="ページ削除 (X)">p<br>×</button>

        <div class="separator"></div>

        <button id="btnSerif" class="tool-toggle" title="セリフ (S)">セ<br>リフ</button>
        <button id="btnKoma" class="tool-toggle" title="コマ枠 (K)">コマ<br>枠</button>
        
        <div class="separator"></div>

        <label for="sliderFontSize" title="文字サイズ">F:</label>
        <input type="range" id="sliderFontSize" min="10" max="48" value="16">
        <span id="fontSizeValue">16px</span>

        <div class="separator"></div>

        <button id="btnCopyText" title="テキストコピー">コ<br>ピー</button>
        <button id="btnPasteText" title="テキストペースト">ペ<br>ースト</button>
        
        <div class="separator"></div>
        
        <button id="btnPNG" title="PNG書き出し/共有">P<br>N<br>G</button>
        <button id="btnZIP" title="ZIP書き出し">Z<br>I<br>P</button>
        
        <div class="separator-right"></div>
        
        <button id="btnResetPage" title="このページをリセット">ページ<br>リセット</button>
        <button id="btnReset" title="全リセット">全<br>リセット</button>
    </div>

    <div id="canvasContainer">
        </div>

    <textarea id="bubbleEditor"></textarea>

    <div id="selectionPanelBubble" class="selection-panel">
        <button id="shapeEllipse" class="vertical-btn">楕円</button>
        <button id="shapeRect" class="vertical-btn">四角</button>
        <button id="deleteBubble" class="delete vertical-btn">削除</button>
    </div>
    
    <div id="selectionPanelGutter" class="selection-panel">
        <button id="deleteGutter" class="delete vertical-btn">コマ枠<br>削除</button>
    </div>

    <div id="pageIndicator">1 / 1</div>

    <textarea id="textIO" aria-hidden="true"></textarea>

</body>
</html>
